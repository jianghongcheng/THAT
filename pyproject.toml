[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "that-hyperspectral"
version = "0.1.0"
description = "Token-wise High-frequency Augmentation Transformer for hyperspectral pansharpening"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "torch>=2.2,<3",
  "numpy>=1.22",
  "scipy>=1.8",
  "scikit-learn>=1.1",
  "einops>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "black==24.8.0"]

[project.scripts]
that-prepare = "that.cli.prepare_data:main"
that-train = "that.cli.train:main"
that-evaluate = "that.cli.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py38"]
