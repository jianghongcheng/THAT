name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      - run: python -m black --check src tests examples
      - run: python -m pytest -q
      - run: that-prepare --help && that-train --help && that-evaluate --help
      - run: python examples/smoke_pipeline.py --output-dir runs/ci-smoke
